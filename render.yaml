services:
  - type: web
    name: hr-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_SSL
        value: true
      # Expense claims: receipt scanning with Gemini (paid tier). Set the key in Render; never commit it.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: CLAIM_SCAN_MONTHLY_CAP_USD
        value: 19
      - key: CLAIM_SCAN_DAILY_LIMIT_PER_USER
        value: 20
